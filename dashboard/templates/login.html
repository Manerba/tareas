<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas - Anmeldung</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-title">Tareas</div>
        <div class="login-subtitle" data-i18n="auth.pleaseLogin">Bitte anmelden</div>

        <div class="login-error" id="loginError"></div>

        <div class="login-field">
            <label data-i18n="auth.username">Benutzername</label>
            <input type="text" id="loginUsername" autocomplete="username" autofocus>
        </div>

        <div class="login-field">
            <label data-i18n="auth.password">Passwort</label>
            <input type="password" id="loginPassword" autocomplete="current-password">
        </div>

        <button class="login-btn" id="loginBtn" data-i18n="auth.login">Anmelden</button>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script>
        // Farbschema laden
        const schemes = { light: 'light', dark: 'dark', graphit: 'light', slate: 'light', ink: 'dark' };
        let savedScheme = localStorage.getItem('dashboard-color-scheme');
        if (!schemes[savedScheme]) {
            savedScheme = localStorage.getItem('dashboard-theme') === 'dark' ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-color-scheme', savedScheme);
        document.documentElement.setAttribute('data-theme', schemes[savedScheme]);

        const usernameInput = document.getElementById('loginUsername');
        const passwordInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('loginError');

        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') passwordInput.focus();
        });

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doLogin();
        });

        loginBtn.addEventListener('click', doLogin);

        async function doLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError(t('auth.enterCredentials'));
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = t('auth.loggingIn');
            errorDiv.style.display = 'none';

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                    body: JSON.stringify({ username, password }),
                });

                if (!resp.ok) {
                    const data = await resp.json().catch(() => ({}));
                    if (resp.status === 429) {
                        const retryAfter = parseInt(resp.headers.get('Retry-After') || '10', 10);
                        startCountdown(retryAfter, data.detail || t('auth.enterCredentials'));
                        return;
                    }
                    throw new Error(data.detail || t('auth.loginFailed'));
                }

                window.location.href = '/aufgaben';
            } catch (error) {
                showError(error.message);
                loginBtn.disabled = false;
                loginBtn.textContent = t('auth.login');
            }
        }

        function startCountdown(seconds, msg) {
            loginBtn.disabled = true;
            usernameInput.disabled = true;
            passwordInput.disabled = true;
            showError(msg);
            let remaining = seconds;
            loginBtn.textContent = t('auth.locked', { remaining });
            const iv = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(iv);
                    loginBtn.disabled = false;
                    usernameInput.disabled = false;
                    passwordInput.disabled = false;
                    loginBtn.textContent = t('auth.login');
                    errorDiv.style.display = 'none';
                } else {
                    loginBtn.textContent = t('auth.locked', { remaining });
                }
            }, 1000);
        }

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
