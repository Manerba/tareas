<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/expandable_table.css">
</head>
<body data-admin-mode="true">
    <!-- Header -->
    <header class="header">
        <h1>Tareas <span style="font-size:12px; opacity:0.7; font-weight:normal;">Admin</span></h1>
        <div class="header-controls">
            <span class="header-username" id="headerUsername"></span>
            <div class="settings-dropdown-wrapper">
                <button class="settings-btn" id="settingsBtn">&#x2699;&#xFE0F;</button>
                <nav class="settings-dropdown" id="settingsDropdown" style="display: none;">
                    <div class="settings-menu">
                        <div class="settings-item" id="changePasswordBtn">
                            <span class="settings-icon">&#x1F511;</span>
                            <span class="settings-label" data-i18n="password.change">Passwort aendern</span>
                        </div>
                        <div class="settings-item settings-danger" id="logoutBtn">
                            <span class="settings-icon">&#x2192;</span>
                            <span class="settings-label" data-i18n="auth.logout">Abmelden</span>
                        </div>
                        <div class="settings-divider"></div>
                        <div class="settings-item" id="langToggle">
                            <span class="settings-icon">&#x1F310;</span>
                            <span class="settings-label" data-i18n="settings.language">Sprache</span>
                            <span class="settings-value" id="langStatus">DE</span>
                            <span class="settings-expand" id="langExpandIcon">&#x25BE;</span>
                        </div>
                        <div class="settings-sub" id="langSubMenu" style="display:none"></div>
                        <div class="settings-item" id="schemeToggle">
                            <span class="settings-icon">&#x25A3;</span>
                            <span class="settings-label" data-i18n="settings.colorScheme">Farbschema</span>
                            <span class="settings-value" id="schemeStatus">Hell</span>
                            <span class="settings-expand" id="schemeExpandIcon">&#x25BE;</span>
                        </div>
                        <div class="settings-sub" id="schemeSubMenu" style="display:none"></div>
                        <div class="settings-divider"></div>
                        <div class="settings-item settings-danger" id="restartBtn">
                            <span class="settings-icon">&#x21BB;</span>
                            <span class="settings-label" data-i18n="settings.restart">Restart Dashboard</span>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs main-tabs">
        <a class="tab active" href="#" data-tab="allgemein" data-i18n="nav.allgemein">Allgemein</a>
        <a class="tab" href="#" data-tab="benutzer" data-i18n="nav.benutzer">Benutzerverwaltung</a>
        <a class="tab" href="#" data-tab="ldap" data-i18n="nav.ldap">LDAP</a>
        <a class="tab" href="#" data-tab="nextcloud" data-i18n="nav.nextcloud">Nextcloud</a>
        <a class="tab" href="#" data-tab="onlyoffice" data-i18n="nav.onlyoffice">ONLYOFFICE</a>
        <a class="tab" href="#" data-tab="mail" data-i18n="nav.mail">Mail</a>
        <a class="tab" href="#" data-tab="tls" data-i18n="nav.tls">TLS</a>
        <a class="tab" href="#" data-tab="mcp" data-i18n="nav.mcp">MCP</a>
    </nav>

    <!-- Filter Bar -->
    <div class="filter-bar" id="filterBar" style="display: none;"></div>

    <!-- Content Container -->
    <main class="container" id="contentContainer">
        <div class="table-loading">
            <div class="spinner"></div>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/expandable_table.js"></script>
    <script src="/static/js/app_core.js"></script>
    <script src="/static/js/tab_allgemein.js"></script>
    <script src="/static/js/tab_benutzer.js"></script>
    <script src="/static/js/tab_ldap.js"></script>
    <script src="/static/js/tab_nextcloud.js"></script>
    <script src="/static/js/tab_onlyoffice.js"></script>
    <script src="/static/js/tab_mail.js"></script>
    <script src="/static/js/tab_tls.js"></script>
    <script src="/static/js/tab_mcp.js"></script>
    <script>
        // Admin-App: User laden und Tab initialisieren
        let adminCurrentTab = 'allgemein';

        document.addEventListener('DOMContentLoaded', async function() {
            await loadCurrentUser();

            // Tab-Klick-Handler
            document.querySelectorAll('.main-tabs .tab').forEach(tab => {
                tab.addEventListener('click', function(e) {
                    e.preventDefault();
                    switchAdminTab(this.dataset.tab);
                });
            });

            // URL-basierter Tab
            const path = window.location.pathname.replace(/\/+$/, '');
            if (path === '/benutzer') {
                switchAdminTab('benutzer');
            } else if (path === '/ldap') {
                switchAdminTab('ldap');
            } else if (path === '/nextcloud') {
                switchAdminTab('nextcloud');
            } else if (path === '/onlyoffice') {
                switchAdminTab('onlyoffice');
            } else if (path === '/mail') {
                switchAdminTab('mail');
            } else if (path === '/tls') {
                switchAdminTab('tls');
            } else if (path === '/mcp') {
                switchAdminTab('mcp');
            } else {
                switchAdminTab('allgemein');
            }
        });

        function switchAdminTab(tab) {
            adminCurrentTab = tab;

            // Tab-Buttons aktualisieren
            document.querySelectorAll('.main-tabs .tab').forEach(t => {
                t.classList.remove('active');
                if (t.dataset.tab === tab) t.classList.add('active');
            });

            // URL aktualisieren
            const pathMap = { 'allgemein': '/allgemein', 'benutzer': '/benutzer', 'ldap': '/ldap', 'nextcloud': '/nextcloud', 'onlyoffice': '/onlyoffice', 'mail': '/mail', 'tls': '/tls', 'mcp': '/mcp' };
            history.replaceState({}, '', pathMap[tab] || '/allgemein');

            // Tab-Inhalt laden
            if (tab === 'allgemein') {
                initAllgemeinTab();
            } else if (tab === 'benutzer') {
                initBenutzerTab();
            } else if (tab === 'ldap') {
                initLdapTab();
            } else if (tab === 'nextcloud') {
                initNextcloudTab();
            } else if (tab === 'onlyoffice') {
                initOnlyOfficeTab();
            } else if (tab === 'mail') {
                initMailTab();
            } else if (tab === 'tls') {
                initTlsTab();
            } else if (tab === 'mcp') {
                initMcpTab();
            }
        }
    </script>
</body>
</html>
