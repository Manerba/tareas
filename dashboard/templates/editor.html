<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - Tareas</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/onlyoffice.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .editor-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .oo-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background-color: var(--bg-header);
            color: var(--text-header);
            flex-shrink: 0;
        }
        .oo-title {
            font-size: 15px;
            font-weight: 600;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .oo-body {
            flex: 1;
            overflow: hidden;
            background: var(--bg-primary, #fff);
        }
        .oo-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted, #999);
            font-size: 14px;
            gap: 10px;
        }
        /* Kleiner Spinner (ueberschreibt style.css .spinner) */
        .oo-loading .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted, #999);
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }
    </style>
</head>
<body>
    <div class="editor-page">
        <div class="oo-header">
            <div class="oo-title" id="editorTitle" data-i18n="editor.loading">Wird geladen...</div>
            <div id="oo-badge-container"></div>
        </div>
        <div class="oo-body" id="ooEditorBody">
            <div class="oo-loading">
                <div class="spinner"></div>
                <span data-i18n="editor.editorLoading">Editor wird geladen...</span>
            </div>
        </div>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/editor_page.js"></script>
</body>
</html>
